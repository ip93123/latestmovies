<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vidy Test Player</title>
  <style>
    body {
      margin: 0;
      background: #05070a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e5e7eb;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    button {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      background: #e50914;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover {
      background: #b91c1c;
    }
    .btn-tv {
      background: #2563eb;
    }
    .btn-tv:hover {
      background: #1d4ed8;
    }
    .player-wrapper {
      width: 90vw;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid #374151;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    #status {
      margin-top: 15px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h1>Vidy.st Official Player Test</h1>

  <div class="controls">
    <input id="mediaId" type="text" value="315162" placeholder="TMDB ID" />
    <button onclick="playMovie()">Play Movie (315162)</button>
    <button class="btn-tv" onclick="playTv()">Play TV Show (Breaking Bad: 1396)</button>
    <button style="background:#4b5563" onclick="testMovyMovie()">Play User Test Movie (1516698)</button>
  </div>

  <div class="player-wrapper">
    <iframe
      id="testFrame"
      src="https://vidy.st/movie/315162?color=E8C97A"
      width="100%"
      height="100%"
      frameborder="0"
      allowfullscreen
      allow="encrypted-media; autoplay *; fullscreen *"
    ></iframe>
  </div>

  <div id="status">Listening for player events...</div>

  <script>
    const frame = document.getElementById('testFrame');
    const statusDiv = document.getElementById('status');

    function playMovie() {
      const id = document.getElementById('mediaId').value.trim() || '315162';
      const url = `https://vidy.st/movie/${id}?color=E8C97A`;
      statusDiv.textContent = `Loading: ${url}`;
      frame.src = url;
    }

    function playTv() {
      const id = document.getElementById('mediaId').value.trim() || '1396';
      const url = `https://vidy.st/tv/${id}/1/1?color=E8C97A&nextEpisode=true&episodeSelector=true&autoplayNextEpisode=true`;
      statusDiv.textContent = `Loading: ${url}`;
      frame.src = url;
    }

    function testMovyMovie() {
      const id = '1516698';
      document.getElementById('mediaId').value = id;
      const url = `https://vidy.st/movie/${id}?color=E8C97A`;
      statusDiv.textContent = `Loading: ${url}`;
      frame.src = url;
    }

    window.addEventListener("message", (event) => {
      console.log("[Player Event]", event.origin, event.data);
      if (typeof event.data === "string") {
        try {
          const d = JSON.parse(event.data);
          statusDiv.textContent = `Received event: ${d.event || d.type || JSON.stringify(d)}`;
        } catch(e) {
          statusDiv.textContent = `Raw message: ${event.data.slice(0, 100)}`;
        }
      }
    });
  </script>
</body>
</html>
